<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dos por uno: Matrícula pendiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pizarra:#24493F;
    --pizarra-osc:#16302A;
    --tiza:#F7F9F4;
    --amarillo:#F2C14E;
    --timbre:#D1495B;
    --cielo:#8FD3F4;
    --azul:#2E6FB7;
    --apoyo:#2BA36B;
    --display:'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --texto:'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--cielo);font-family:var(--texto);color:var(--pizarra-osc);touch-action:none;user-select:none;-webkit-user-select:none}
  #escena{position:fixed;inset:0}
  #escena canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  .hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s}
  .hud.visible{opacity:1}
  .panel{background:rgba(22,48,42,.88);color:var(--tiza);border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .energia{min-width:150px}
  .etiqueta{font-size:12px;font-weight:800;opacity:.85;margin-bottom:4px}
  .barra{height:12px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}
  .barra > i{display:block;height:100%;width:100%;background:var(--apoyo);border-radius:8px;transition:width .25s, background .25s}
  .progreso{flex:1;max-width:420px}
  .progreso .barra > i{background:var(--amarillo)}
  .progreso .fila{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px}
  .puntos{text-align:right;min-width:92px}
  .puntos b{font-family:var(--display);font-size:22px;font-weight:400;line-height:1;display:block}
  .btn-pausa{pointer-events:auto;border:0;background:rgba(22,48,42,.88);color:var(--tiza);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .btn-pausa:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

  /* ---------- Avisos ---------- */
  #aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translate(-50%,-10px);opacity:0;transition:opacity .2s, transform .2s;z-index:6;pointer-events:none;max-width:min(92vw,460px);text-align:center;padding:10px 16px;border-radius:14px;color:#fff;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2)}
  #aviso.mostrar{opacity:1;transform:translate(-50%,0)}
  #aviso .titulo{font-family:var(--display);font-size:22px;font-weight:400;display:block}
  #aviso .msj{font-size:14px;font-weight:600;display:block;margin-top:2px}
  #aviso.obs{background:var(--timbre)}
  #aviso.apo{background:var(--apoyo)}

  /* ---------- Controles táctiles ---------- */
  .tactil{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:none;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}
  .tactil.visible{display:flex}
  .tactil button{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:0;background:rgba(22,48,42,.75);color:var(--tiza);font-size:28px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .tactil button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .tactil .izq-der{display:flex;gap:12px}
  @media (pointer:fine){ .tactil{display:none !important} }

  /* ---------- Pantallas ---------- */
  .pantalla{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:10;background:rgba(143,211,244,.35);overflow-y:auto}
  .pantalla.activa{display:flex}
  .pizarra{position:relative;width:min(100%,640px);background:var(--pizarra);color:var(--tiza);border:10px solid #9C6B3F;border-radius:18px;padding:28px 26px 24px;box-shadow:0 10px 0 #6E4A2A, 0 18px 40px rgba(0,0,0,.25);margin:auto}
  .pizarra::after{content:"";position:absolute;left:18%;right:18%;bottom:-10px;height:6px;background:#6E4A2A;border-radius:0 0 6px 6px}
  .titulo-juego{font-family:var(--display);font-weight:400;font-size:clamp(46px,11vw,78px);line-height:.9;letter-spacing:.5px;color:var(--tiza);text-shadow:0 4px 0 rgba(0,0,0,.25)}
  .timbre{display:inline-block;margin-top:12px;font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,28px);color:var(--timbre);background:var(--tiza);border:4px solid var(--timbre);border-radius:8px;padding:2px 14px;transform:rotate(-4deg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .bajada{margin:18px 0 16px;font-size:16px;line-height:1.5;max-width:52ch;opacity:.95}
  .columnas{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  @media (max-width:520px){ .columnas{grid-template-columns:1fr} }
  .columnas h3{font-family:var(--display);font-weight:400;font-size:20px;margin-bottom:8px}
  .fichas{display:flex;flex-wrap:wrap;gap:6px}
  .ficha{font-size:13px;font-weight:800;padding:4px 9px;border-radius:999px;color:#fff;white-space:nowrap}
  .controles{font-size:14px;line-height:1.5;opacity:.85;margin-bottom:18px}
  kbd{font-family:var(--texto);font-weight:800;background:rgba(255,255,255,.15);border-radius:5px;padding:0 6px}
  .boton{font-family:var(--display);font-weight:400;font-size:24px;border:0;cursor:pointer;background:var(--amarillo);color:var(--pizarra-osc);padding:12px 30px;border-radius:14px;box-shadow:0 5px 0 #B98A1F}
  .boton:hover{filter:brightness(1.05)}
  .boton:active{transform:translateY(3px);box-shadow:0 2px 0 #B98A1F}
  .boton:focus-visible{outline:3px solid var(--tiza);outline-offset:3px}
    .acciones{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .boton-sec{display:inline-block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--tiza);text-decoration:none;padding:10px 22px;border:3px solid rgba(247,249,244,.7);border-radius:14px}
  .boton-sec:hover{background:rgba(255,255,255,.1)}
  .boton-sec:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
  .stats div{font-size:13px;font-weight:800;opacity:.9}
  .stats b{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--amarillo);opacity:1}
  .resultado h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,8vw,54px);line-height:1}
  .resultado .subtit{margin:16px 0 8px;font-family:var(--display);font-weight:400;font-size:20px}
  .record{font-size:13px;opacity:.8;margin-bottom:16px}
  #cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;color:var(--pizarra);z-index:20;background:var(--cielo)}
  @media (prefers-reduced-motion:reduce){ #aviso,.hud,.barra > i{transition:none} }
</style>
</head>
<body>

<div id="escena"></div>
<div id="cargando">Cargando…</div>

<!-- HUD -->
<div class="hud" id="hud">
  <div class="panel energia">
    <div class="etiqueta">Energía</div>
    <div class="barra"><i id="barraEnergia"></i></div>
  </div>
  <div class="panel progreso">
    <div class="fila"><span id="txtMetros">0 m</span><span id="txtMeta">Meta</span></div>
    <div class="barra"><i id="barraProgreso" style="width:0%"></i></div>
  </div>
  <div class="panel puntos">
    <div class="etiqueta">Puntos</div>
    <b id="txtPuntos">0</b>
  </div>
  <button class="btn-pausa" id="btnPausa" aria-label="Pausar">⏸</button>
</div>

<div id="aviso" role="status" aria-live="polite"></div>

<!-- Controles táctiles -->
<div class="tactil" id="tactil">
  <div class="izq-der">
    <button id="tIzq" aria-label="Carril izquierdo">◀</button>
    <button id="tDer" aria-label="Carril derecho">▶</button>
  </div>
  <button id="tSalto" aria-label="Saltar">▲</button>
</div>

<!-- Pantalla de inicio -->
<section class="pantalla" id="pInicio">
  <div class="pizarra">
    <h1 class="titulo-juego" id="tituloJuego"></h1>
    <div class="timbre" id="subtituloJuego"></div>
    <p class="bajada" id="descripcionJuego"></p>
    <div class="columnas">
      <div><h3>Esquiva</h3><div class="fichas" id="fichasObs"></div></div>
      <div><h3>Recoge</h3><div class="fichas" id="fichasApo"></div></div>
    </div>
    <p class="controles">
      Cambia de carril con <kbd>←</kbd> <kbd>→</kbd> o <kbd>A</kbd> <kbd>D</kbd>. Salta con <kbd>↑</kbd>, <kbd>W</kbd> o <kbd>Espacio</kbd>.
      En el celular, desliza el dedo o usa los botones.
    </p>
       <div class="acciones">
      <button class="boton" id="btnJugar">Jugar</button>
      <a class="boton-sec" href="../index.html#sobre">Sobre el Mag</a>
    </div>
  </div>
</section>

<!-- Pantalla de pausa -->
<section class="pantalla" id="pPausa">
  <div class="pizarra resultado">
    <h2>En pausa</h2>
    <p class="bajada">El liceo te espera. Sigue cuando quieras.</p>
    <button class="boton" id="btnSeguir">Seguir</button>
  </div>
</section>

<!-- Pantalla final -->
<section class="pantalla" id="pFin">
  <div class="pizarra resultado">
    <h2 id="finTitulo"></h2>
    <p class="bajada" id="finMensaje"></p>
    <div class="stats">
      <div><b id="finMetros">0</b>metros</div>
      <div><b id="finApoyos">0</b>apoyos recogidos</div>
      <div><b id="finEsquivados">0</b>obstáculos esquivados</div>
      <div><b id="finPuntos">0</b>puntos</div>
    </div>
    <div id="finListaBox">
      <div class="subtit" id="finListaTitulo"></div>
      <div class="fichas" id="finLista"></div>
    </div>
    <p class="record" id="finRecord"></p>
     <div class="acciones">
      <button class="boton" id="btnOtraVez">Volver a intentar</button>
      <a class="boton-sec" href="../index.html#sobre">Sobre el Mag</a>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   CONFIGURACIÓN — los estudiantes pueden editar todo este bloque.
   Cambien textos, emojis, colores y mensajes (ideal: usar cuñas o datos
   del reportaje). No es necesario tocar el código que viene después.
   ===================================================================== */
const CONFIG = {
  titulo: "Dos por uno",
  subtitulo: "Matrícula pendiente",
  descripcion: "Vas camino al liceo para terminar tus estudios. Esquiva lo que te frena, recoge lo que te impulsa y llega a la meta para completar tu matrícula.",

  metaMetros: 1500,          // distancia hasta el liceo
  energiaInicial: 100,
  danoPorObstaculo: 25,      // cuánta energía quita cada choque
  recuperaPorApoyo: 10,      // cuánta energía devuelve cada apoyo
  velocidadInicial: 12,
  velocidadMaxima: 26,

  obstaculos: [
    { nombre: "Drogadicción",           emoji: "💊", color: "#7B3F98", mensaje: "El consumo aleja a muchos jóvenes de las aulas." },
    { nombre: "Bullying",               emoji: "😣", color: "#C0392B", mensaje: "El acoso escolar empuja a abandonar el colegio." },
    { nombre: "Salud mental",           emoji: "🧠", color: "#5B6C8F", mensaje: "Sin apoyo emocional, seguir estudiando cuesta el doble." },
    { nombre: "Problemas económicos",   emoji: "💸", color: "#B9770E", mensaje: "Muchos dejan de estudiar para aportar en la casa." },
    { nombre: "Problemas familiares",   emoji: "🏚️", color: "#8E5B3E", mensaje: "Los conflictos en casa también llegan al aula." },
    { nombre: "Salud",                  emoji: "🤒", color: "#A04060", mensaje: "Una enfermedad puede interrumpir años de estudio." },
    { nombre: "Malas influencias",      emoji: "👥", color: "#4A4A4A", mensaje: "El entorno puede alejarte de tus metas." },
    { nombre: "Falta de oportunidades", emoji: "🚫", color: "#9A2A2A", mensaje: "Sin oportunidades, el camino se hace cuesta arriba." },
    { nombre: "Delincuencia",           emoji: "🚨", color: "#2C3E50", mensaje: "La delincuencia corta trayectorias escolares." },
    { nombre: "Discriminación",         emoji: "✋", color: "#6D3B47", mensaje: "Ser discriminado hace sentir que el aula no es tu lugar." }
  ],

  apoyos: [
    { nombre: "Deporte",       emoji: "⚽", color: "#2BA36B", mensaje: "El deporte da disciplina y comunidad." },
    { nombre: "Integración",   emoji: "🤝", color: "#1F9E9E", mensaje: "Sentirse parte del grupo da fuerzas para volver." },
    { nombre: "Felicidad",     emoji: "😊", color: "#E0A100", mensaje: "El bienestar también es motor para aprender." },
    { nombre: "Educación",     emoji: "📚", color: "#2E6FB7", mensaje: "Terminar los estudios abre nuevas puertas." },
    { nombre: "Oportunidades", emoji: "🚪", color: "#8E44AD", mensaje: "Una segunda oportunidad lo cambia todo." },
    { nombre: "Trabajo",       emoji: "💼", color: "#D35400", mensaje: "Estudiar y trabajar es posible con apoyo." },
    { nombre: "Seguridad",     emoji: "🛡️", color: "#16A085", mensaje: "Un entorno seguro permite concentrarse en aprender." }
  ],

  textoMeta: "Liceo · Matrícula abierta",
  finalGanoTitulo: "¡Matrícula completada!",
  finalGanoMensaje: "Llegaste al liceo. Los apoyos que encontraste en el camino hicieron la diferencia: nadie termina sus estudios en solitario.",
  finalPerdioTitulo: "Matrícula pendiente",
  finalPerdioMensaje: "Los obstáculos te dejaron sin energía, como le pasa a miles de jóvenes y adultos en Chile. La buena noticia: siempre se puede volver a intentar.",

  colores: {
    cielo: "#8FD3F4",
    pasto: "#7CC46A",
    calle: "#5E6470",
    vereda: "#D9D2C5",
    lineas: "#F7F9F4",
    polera: "#2E6FB7",
    pantalon: "#2B2D42",
    piel: "#D9A27A",
    pelo: "#3B2A20",
    mochila: "#F2C14E",
    liceo: "#E9D8A6",
    techo: "#B5523B"
  }
};
/* ======================= FIN DE LA CONFIGURACIÓN ======================= */


(function(){
  'use strict';
  const C = CONFIG.colores;
  const CARRILES = [-2.2, 0, 2.2];
  const Z_APARICION = -100;
  const LARGO_DECORADO = 192;

  // ---------- Textos de las pantallas ----------
  document.getElementById('tituloJuego').textContent = CONFIG.titulo;
  document.getElementById('subtituloJuego').textContent = CONFIG.subtitulo;
  document.getElementById('descripcionJuego').textContent = CONFIG.descripcion;
  document.getElementById('txtMeta').textContent = CONFIG.metaMetros + ' m';
  const llenarFichas = (id, lista) => {
    const cont = document.getElementById(id);
    cont.innerHTML = '';
    lista.forEach(it => {
      const s = document.createElement('span');
      s.className = 'ficha';
      s.style.background = it.color;
      s.textContent = it.emoji + ' ' + it.nombre;
      cont.appendChild(s);
    });
  };
  llenarFichas('fichasObs', CONFIG.obstaculos);
  llenarFichas('fichasApo', CONFIG.apoyos);

  // ---------- Récord (opcional, por navegador) ----------
  const leerRecord = () => { try { return parseInt(localStorage.getItem('dosporuno-record') || '0', 10) || 0; } catch(e){ return 0; } };
  const guardarRecord = v => { try { localStorage.setItem('dosporuno-record', String(v)); } catch(e){} };

  // ---------- Three.js básico ----------
  const contenedor = document.getElementById('escena');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  contenedor.appendChild(renderer.domElement);

  const escena = new THREE.Scene();
  escena.background = new THREE.Color(C.cielo);
  escena.fog = new THREE.Fog(C.cielo, 45, 115);

  const camara = new THREE.PerspectiveCamera(60, 1, 0.1, 220);
  const camBase = { y: 4.2, z: 7.5 };

  escena.add(new THREE.HemisphereLight(0xffffff, 0x6a8f4e, 0.75));
  const sol = new THREE.DirectionalLight(0xfff4dd, 0.95);
  sol.position.set(8, 16, 6);
  sol.castShadow = true;
  sol.shadow.mapSize.set(1024, 1024);
  Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
  sol.target.position.set(0, 0, -6);
  escena.add(sol, sol.target);

  // Sol visible y nubes
  const esferaSol = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xFFE38A, fog: false }));
  esferaSol.position.set(-40, 45, -170);
  escena.add(esferaSol);
  const matNube = new THREE.MeshLambertMaterial({ color: 0xffffff, fog: false });
  const geoNube = new THREE.SphereGeometry(1, 12, 10);
  const nubes = [];
  for (let i = 0; i < 7; i++) {
    const n = new THREE.Group();
    for (let j = 0; j < 4; j++) {
      const b = new THREE.Mesh(geoNube, matNube);
      b.position.set(j * 2.2 - 3, Math.random() * 1.2, Math.random() * 1.5);
      b.scale.setScalar(2 + Math.random() * 1.6);
      n.add(b);
    }
    n.position.set(-70 + i * 24 + Math.random() * 10, 26 + Math.random() * 14, -150 - Math.random() * 30);
    escena.add(n);
    nubes.push(n);
  }

  const mat = col => new THREE.MeshLambertMaterial({ color: col });
  const malla = (geo, material, sombra = true) => {
    const m = new THREE.Mesh(geo, material);
    m.castShadow = sombra; m.receiveShadow = true;
    return m;
  };

  // ---------- Suelo ----------
  const pasto = new THREE.Mesh(new THREE.PlaneGeometry(200, 320), mat(C.pasto));
  pasto.rotation.x = -Math.PI / 2; pasto.position.z = -100; pasto.receiveShadow = true;
  escena.add(pasto);
  const calle = new THREE.Mesh(new THREE.PlaneGeometry(7, 320), mat(C.calle));
  calle.rotation.x = -Math.PI / 2; calle.position.set(0, 0.01, -100); calle.receiveShadow = true;
  escena.add(calle);
  [-1, 1].forEach(lado => {
    const v = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.18, 320), mat(C.vereda));
    v.position.set(lado * 4.3, 0.09, -100); v.receiveShadow = true;
    escena.add(v);
  });

  // Líneas de la calle (se reciclan)
  const lineas = [];
  const geoLinea = new THREE.PlaneGeometry(0.14, 2.4);
  const matLinea = new THREE.MeshBasicMaterial({ color: C.lineas });
  [-1.1, 1.1].forEach(x => {
    for (let i = 0; i < 30; i++) {
      const l = new THREE.Mesh(geoLinea, matLinea);
      l.rotation.x = -Math.PI / 2;
      l.position.set(x, 0.02, 10 - i * 6);
      escena.add(l); lineas.push(l);
    }
  });

  // ---------- Decorado lateral ----------
  const geoTronco = new THREE.CylinderGeometry(0.18, 0.24, 1.4, 7);
  const geoCopa = new THREE.ConeGeometry(1.2, 2.6, 7);
  const geoCopaRedonda = new THREE.IcosahedronGeometry(1.3, 0);
  const matTronco = mat('#7A5230');
  const matsCopa = ['#3F8F4A', '#4FA65A', '#2F7A3E'].map(mat);
  const coloresCasa = ['#F4A261', '#E9C46A', '#A8DADC', '#F28482', '#CDB4DB', '#FFFFFF', '#B7E4C7'];
  const matTecho = mat(C.techo);
  const matVentana = mat('#5B8DB8');
  const geoPoste = new THREE.CylinderGeometry(0.07, 0.09, 3.4, 6);
  const matPoste = mat('#555B66');

  function crearArbol() {
    const g = new THREE.Group();
    const t = malla(geoTronco, matTronco); t.position.y = 0.7; g.add(t);
    const redondo = Math.random() < 0.5;
    const c = malla(redondo ? geoCopaRedonda : geoCopa, matsCopa[Math.floor(Math.random() * 3)]);
    c.position.y = redondo ? 2.2 : 2.6; g.add(c);
    const s = 0.8 + Math.random() * 0.6; g.scale.setScalar(s);
    return g;
  }
  function crearCasa() {
    const g = new THREE.Group();
    const w = 2.6 + Math.random() * 1.4, h = 2 + Math.random() * 1.6, d = 2.6 + Math.random();
    const cuerpo = malla(new THREE.BoxGeometry(w, h, d), mat(coloresCasa[Math.floor(Math.random() * coloresCasa.length)]));
    cuerpo.position.y = h / 2; g.add(cuerpo);
    const techo = malla(new THREE.ConeGeometry(Math.max(w, d) * 0.78, 1.3, 4), matTecho);
    techo.position.y = h + 0.65; techo.rotation.y = Math.PI / 4; g.add(techo);
    const v = malla(new THREE.BoxGeometry(0.7, 0.6, 0.05), matVentana, false);
    v.position.set(0, h * 0.6, d / 2 + 0.03); g.add(v);
    return { g, w };
  }
  function crearPoste() {
    const g = new THREE.Group();
    const p = malla(geoPoste, matPoste); p.position.y = 1.7; g.add(p);
    const luz = malla(new THREE.SphereGeometry(0.2, 8, 6), mat('#FFF3B0'), false); luz.position.y = 3.45; g.add(luz);
    return g;
  }

  const decorados = [];
  [-1, 1].forEach(lado => {
    for (let i = 0; i < 24; i++) {
      const r = Math.random();
      let obj, x;
      if (r < 0.45) { obj = crearArbol(); x = lado * (5.8 + Math.random() * 5); }
      else if (r < 0.8) { const c = crearCasa(); obj = c.g; x = lado * (7 + Math.random() * 4 + c.w / 2); obj.rotation.y = lado > 0 ? -Math.PI / 2 : Math.PI / 2; }
      else { obj = crearPoste(); x = lado * 5.3; }
      obj.position.set(x, 0, 10 - i * 8 - Math.random() * 3);
      escena.add(obj); decorados.push(obj);
    }
  });

  // ---------- Etiquetas con texto (sprites) ----------
  function texturaEtiqueta(texto, colorFondo) {
    const cv = document.createElement('canvas');
    cv.width = 512; cv.height = 128;
    const ctx = cv.getContext('2d');
    ctx.font = "44px 'Lilita One', 'Arial Rounded MT Bold', sans-serif";
    const ancho = Math.min(500, ctx.measureText(texto).width + 56);
    const x0 = (512 - ancho) / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    redondear(ctx, x0, 22, ancho, 92, 30); ctx.fill();
    ctx.fillStyle = colorFondo;
    redondear(ctx, x0, 14, ancho, 92, 30); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(texto, 256, 62, 470);
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = 4;
    return tex;
  }
  function texturaCara(emoji, color) {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 256;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = color; ctx.fillRect(0, 0, 256, 256);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let i = -256; i < 256; i += 64) { ctx.beginPath(); ctx.moveTo(i, 256); ctx.lineTo(i + 32, 256); ctx.lineTo(i + 288, 0); ctx.lineTo(i + 256, 0); ctx.fill(); }
    ctx.font = "130px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 128, 140);
    return new THREE.CanvasTexture(cv);
  }
  function redondear(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // Recursos compartidos (se crean una vez que cargan las fuentes)
  const geoBarrera = new THREE.BoxGeometry(1.7, 1.1, 0.6);
  const geoGema = new THREE.IcosahedronGeometry(0.45, 0);
  const geoAnillo = new THREE.TorusGeometry(0.7, 0.07, 8, 32);
  let recursosObs = [], recursosApo = [];
  function prepararRecursos() {
    recursosObs = CONFIG.obstaculos.map(it => {
      const base = mat(it.color);
      const cara = new THREE.MeshLambertMaterial({ map: texturaCara(it.emoji, it.color) });
      return {
        item: it,
        mats: [base, base, base, base, cara, base],
        etiqueta: new THREE.SpriteMaterial({ map: texturaEtiqueta(it.emoji + ' ' + it.nombre, it.color), depthWrite: false })
      };
    });
    recursosApo = CONFIG.apoyos.map(it => ({
      item: it,
      gema: new THREE.MeshLambertMaterial({ color: it.color, emissive: new THREE.Color(it.color), emissiveIntensity: 0.45 }),
      anillo: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }),
      etiqueta: new THREE.SpriteMaterial({ map: texturaEtiqueta(it.emoji + ' ' + it.nombre, it.color), depthWrite: false })
    }));
  }

  // ---------- Personaje ----------
  const jugador = new THREE.Group();
  const partes = {};
  (function crearJugador() {
    const mPolera = mat(C.polera), mPant = mat(C.pantalon), mPiel = mat(C.piel), mPelo = mat(C.pelo), mMochila = mat(C.mochila);
    const torso = malla(new THREE.BoxGeometry(0.72, 0.8, 0.42), mPolera); torso.position.y = 1.25; jugador.add(torso);
    const cabeza = malla(new THREE.SphereGeometry(0.3, 16, 12), mPiel); cabeza.position.y = 1.95; jugador.add(cabeza);
    const pelo = malla(new THREE.SphereGeometry(0.31, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), mPelo); pelo.position.y = 1.98; jugador.add(pelo);
    const mochila = malla(new THREE.BoxGeometry(0.58, 0.62, 0.26), mMochila); mochila.position.set(0, 1.3, 0.33); jugador.add(mochila);
    const tira = malla(new THREE.BoxGeometry(0.6, 0.08, 0.05), mat('#B98A1F')); tira.position.set(0, 1.45, 0.47); jugador.add(tira);
    const pierna = (x) => {
      const piv = new THREE.Group(); piv.position.set(x, 0.86, 0);
      const p = malla(new THREE.BoxGeometry(0.26, 0.82, 0.28), mPant); p.position.y = -0.41; piv.add(p);
      const z = malla(new THREE.BoxGeometry(0.28, 0.14, 0.38), mat('#F7F9F4')); z.position.set(0, -0.8, -0.05); piv.add(z);
      jugador.add(piv); return piv;
    };
    const brazo = (x) => {
      const piv = new THREE.Group(); piv.position.set(x, 1.6, 0);
      const b = malla(new THREE.BoxGeometry(0.18, 0.66, 0.2), mPolera); b.position.y = -0.33; piv.add(b);
      const m = malla(new THREE.SphereGeometry(0.1, 8, 6), mPiel); m.position.y = -0.7; piv.add(m);
      jugador.add(piv); return piv;
    };
    partes.piernaI = pierna(-0.19); partes.piernaD = pierna(0.19);
    partes.brazoI = brazo(-0.47); partes.brazoD = brazo(0.47);
  })();
  escena.add(jugador);

  // ---------- Estado del juego ----------
  let estado = 'cargando';            // cargando | menu | jugando | pausa | fin
  let carril = 1, xObjetivo = 0;
  let y = 0, vy = 0, enSuelo = true;
  let velocidad, distancia, energia, puntos, apoyosRecogidos, esquivados, invulnerable, temblor, tiempo;
  let distDesdeFila, proximaFila, metaCreada, meta;
  let golpes = {}, recogidos = {};
  let objetos = [], particulas = [];
  let bolsaObs = [], bolsaApo = [];

  const barraEnergia = document.getElementById('barraEnergia');
  const barraProgreso = document.getElementById('barraProgreso');
  const txtMetros = document.getElementById('txtMetros');
  const txtPuntos = document.getElementById('txtPuntos');
  const hud = document.getElementById('hud');

  function reiniciar() {
    objetos.forEach(o => escena.remove(o.malla)); objetos = [];
    particulas.forEach(p => escena.remove(p.m)); particulas = [];
    if (meta) { escena.remove(meta); meta = null; }
    carril = 1; xObjetivo = 0; y = 0; vy = 0; enSuelo = true;
    jugador.position.set(0, 0, 0); jugador.visible = true;
    velocidad = CONFIG.velocidadInicial; distancia = 0; energia = CONFIG.energiaInicial;
    puntos = 0; apoyosRecogidos = 0; esquivados = 0; invulnerable = 0; temblor = 0; tiempo = 0;
    distDesdeFila = 0; proximaFila = 30; metaCreada = false;
    golpes = {}; recogidos = {}; bolsaObs = []; bolsaApo = [];
    actualizarHUD();
  }

  function sacarDeBolsa(bolsa, total) {
    if (!bolsa.length) {
      for (let i = 0; i < total; i++) bolsa.push(i);
      for (let i = bolsa.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bolsa[i], bolsa[j]] = [bolsa[j], bolsa[i]]; }
    }
    return bolsa.pop();
  }

  function crearObstaculo(idx, c, z) {
    const r = recursosObs[idx];
    const g = new THREE.Group();
    const b = malla(geoBarrera, r.mats); b.position.y = 0.55; g.add(b);
    [-0.7, 0.7].forEach(x => { const p = malla(new THREE.BoxGeometry(0.12, 0.3, 0.5), mat('#333')); p.position.set(x, 0.05, 0); g.add(p); });
    const e = new THREE.Sprite(r.etiqueta); e.scale.set(3.4, 0.85, 1); e.position.y = 1.85; g.add(e);
    g.position.set(CARRILES[c], 0, z);
    escena.add(g);
    objetos.push({ tipo: 'obs', idx, carril: c, malla: g, activo: true });
  }
  function crearApoyo(idx, c, z) {
    const r = recursosApo[idx];
    const g = new THREE.Group();
    const gema = malla(geoGema, r.gema); gema.position.y = 1.1; g.add(gema);
    const anillo = new THREE.Mesh(geoAnillo, r.anillo); anillo.position.y = 1.1; g.add(anillo);
    const e = new THREE.Sprite(r.etiqueta); e.scale.set(3.0, 0.75, 1); e.position.y = 2.1; g.add(e);
    g.position.set(CARRILES[c], 0, z);
    escena.add(g);
    objetos.push({ tipo: 'apo', idx, carril: c, malla: g, activo: true, gema, anillo });
  }

  function crearFila() {
    const orden = [0, 1, 2].sort(() => Math.random() - 0.5);
    const cuantos = distancia > 250 && Math.random() < 0.4 ? 2 : 1;
    for (let i = 0; i < cuantos; i++) crearObstaculo(sacarDeBolsa(bolsaObs, recursosObs.length), orden[i], Z_APARICION);
    if (Math.random() < 0.5) {
      const zApo = Z_APARICION + (Math.random() < 0.5 ? 0 : -6);
      crearApoyo(sacarDeBolsa(bolsaApo, recursosApo.length), orden[2], zApo);
    }
  }

  function crearMeta() {
    meta = new THREE.Group();
    const mP = mat('#F7F9F4'), mL = mat(C.liceo), mT = mat(C.techo);
    [-3.8, 3.8].forEach(x => { const p = malla(new THREE.BoxGeometry(0.6, 4.2, 0.6), mP); p.position.set(x, 2.1, 0); meta.add(p); });
    const viga = malla(new THREE.BoxGeometry(8.2, 0.5, 0.6), mat('#2E6FB7')); viga.position.y = 4.3; meta.add(viga);
    const cartel = new THREE.Sprite(new THREE.SpriteMaterial({ map: texturaEtiqueta(CONFIG.textoMeta, '#2E6FB7'), depthWrite: false }));
    cartel.scale.set(7, 1.75, 1); cartel.position.y = 5.5; meta.add(cartel);
    const liceo = malla(new THREE.BoxGeometry(16, 6, 5), mL); liceo.position.set(0, 3, -10); meta.add(liceo);
    const techo = malla(new THREE.BoxGeometry(17, 0.6, 6), mT); techo.position.set(0, 6.3, -10); meta.add(techo);
    for (let i = -3; i <= 3; i++) {
      if (i === 0) continue;
      const v = malla(new THREE.BoxGeometry(1.2, 1.2, 0.1), matVentana, false); v.position.set(i * 2, 4, -7.45); meta.add(v);
      const v2 = malla(new THREE.BoxGeometry(1.2, 1.2, 0.1), matVentana, false); v2.position.set(i * 2, 1.8, -7.45); meta.add(v2);
    }
    const puerta = malla(new THREE.BoxGeometry(2, 2.8, 0.1), mat('#7A5230'), false); puerta.position.set(0, 1.4, -7.45); meta.add(puerta);
    const reloj = malla(new THREE.CylinderGeometry(0.6, 0.6, 0.15, 20), mP, false); reloj.rotation.x = Math.PI / 2; reloj.position.set(0, 5, -7.4); meta.add(reloj);
    meta.position.z = Z_APARICION;
    escena.add(meta);
    metaCreada = true;
  }

  function explosion(x, yy, z, color) {
    const geo = new THREE.SphereGeometry(0.12, 6, 4);
    const m = new THREE.MeshBasicMaterial({ color });
    for (let i = 0; i < 12; i++) {
      const p = new THREE.Mesh(geo, m);
      p.position.set(x, yy, z);
      escena.add(p);
      particulas.push({ m: p, v: new THREE.Vector3((Math.random() - 0.5) * 6, Math.random() * 5 + 2, (Math.random() - 0.5) * 6), vida: 0.6 });
    }
  }

  // ---------- Avisos ----------

  }

  function actualizarHUD() {
    const pe = Math.max(0, energia) / CONFIG.energiaInicial;
    barraEnergia.style.width = (pe * 100) + '%';
    barraEnergia.style.background = pe > 0.5 ? 'var(--apoyo)' : pe > 0.25 ? 'var(--amarillo)' : 'var(--timbre)';
    const d = Math.min(distancia, CONFIG.metaMetros);
    barraProgreso.style.width = (d / CONFIG.metaMetros * 100) + '%';
    txtMetros.textContent = Math.floor(d) + ' m';
    txtPuntos.textContent = Math.floor(puntos);
  }

  // ---------- Controles ----------
  function mover(dir) {
    if (estado !== 'jugando') return;
    carril = Math.max(0, Math.min(2, carril + dir));
    xObjetivo = CARRILES[carril];
  }
  function saltar() {
    if (estado !== 'jugando' || !enSuelo) return;
    vy = 9.5; enSuelo = false;
  }
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k) && estado === 'jugando') e.preventDefault();
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') mover(-1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') mover(1);
    else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') saltar();
    else if (k === 'p' || k === 'P' || k === 'Escape') { if (estado === 'jugando') pausar(); else if (estado === 'pausa') seguir(); }
  });

  let toque = null;
  window.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    const t = e.changedTouches[0]; toque = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  window.addEventListener('touchend', e => {
    if (!toque) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - toque.x, dy = t.clientY - toque.y;
    toque = null;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) mover(dx > 0 ? 1 : -1);
    else if (dy < 0) saltar();
  }, { passive: true });

  const pulsar = (id, fn) => {
    const b = document.getElementById(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false });
    b.addEventListener('mousedown', fn);
  };
  pulsar('tIzq', () => mover(-1));
  pulsar('tDer', () => mover(1));
  pulsar('tSalto', saltar);

  // ---------- Pantallas ----------
  const pantallas = { inicio: document.getElementById('pInicio'), pausa: document.getElementById('pPausa'), fin: document.getElementById('pFin') };
  const tactil = document.getElementById('tactil');
  function mostrarPantalla(nombre) {
    Object.values(pantallas).forEach(p => p.classList.remove('activa'));
    if (nombre) pantallas[nombre].classList.add('activa');
  }
  function empezar() {
    reiniciar();
    estado = 'jugando';
    mostrarPantalla(null);
    hud.classList.add('visible');
    tactil.classList.add('visible');
    renderer.domElement.focus && renderer.domElement.focus();
  }
  function pausar() {
    if (estado !== 'jugando') return;
    estado = 'pausa'; mostrarPantalla('pausa');
    document.getElementById('btnSeguir').focus();
  }
  function seguir() { estado = 'jugando'; mostrarPantalla(null); }

  function terminar(gano) {
    estado = 'fin';
    tactil.classList.remove('visible');
    const metros = Math.floor(Math.min(distancia, CONFIG.metaMetros));
    if (gano) puntos += 500;
    document.getElementById('finTitulo').textContent = gano ? CONFIG.finalGanoTitulo : CONFIG.finalPerdioTitulo;
    document.getElementById('finTitulo').style.color = gano ? 'var(--amarillo)' : 'var(--tiza)';
    document.getElementById('finMensaje').textContent = gano ? CONFIG.finalGanoMensaje : CONFIG.finalPerdioMensaje;
    document.getElementById('finMetros').textContent = metros;
    document.getElementById('finApoyos').textContent = apoyosRecogidos;
    document.getElementById('finEsquivados').textContent = esquivados;
    document.getElementById('finPuntos').textContent = Math.floor(puntos);

    const lista = document.getElementById('finLista');
    lista.innerHTML = '';
    const fuente = gano ? recogidos : golpes;
    const datos = gano ? CONFIG.apoyos : CONFIG.obstaculos;
    const claves = Object.keys(fuente);
    document.getElementById('finListaTitulo').textContent = gano ? 'Lo que te impulsó' : 'Lo que te frenó';
    document.getElementById('finListaBox').style.display = claves.length ? 'block' : 'none';
    claves.forEach(i => {
      const it = datos[i];
      const s = document.createElement('span');
      s.className = 'ficha'; s.style.background = it.color;
      s.textContent = it.emoji + ' ' + it.nombre + (fuente[i] > 1 ? ' ×' + fuente[i] : '');
      lista.appendChild(s);
    });

    const rec = leerRecord();
    const total = Math.floor(puntos);
    const txtRec = document.getElementById('finRecord');
    if (total > rec) { guardarRecord(total); txtRec.textContent = 'Nuevo récord en este dispositivo.'; }
    else txtRec.textContent = 'Tu récord en este dispositivo: ' + rec + ' puntos.';

    actualizarHUD();
    setTimeout(() => { mostrarPantalla('fin'); document.getElementById('btnOtraVez').focus(); }, gano ? 300 : 700);
  }

  document.getElementById('btnJugar').addEventListener('click', empezar);
  document.getElementById('btnOtraVez').addEventListener('click', empezar);
  document.getElementById('btnSeguir').addEventListener('click', seguir);
  document.getElementById('btnPausa').addEventListener('click', () => estado === 'jugando' ? pausar() : estado === 'pausa' && seguir());
  document.addEventListener('visibilitychange', () => { if (document.hidden) pausar(); });

  // ---------- Bucle principal ----------
  function moverMundo(avance) {
    lineas.forEach(l => { l.position.z += avance; if (l.position.z > 12) l.position.z -= 180; });
    decorados.forEach(d => { d.position.z += avance; if (d.position.z > 14) d.position.z -= LARGO_DECORADO; });
  }

  function animarPersonaje(dt, corriendo) {
    const f = corriendo ? tiempo * (velocidad * 0.75) : tiempo * 6;
    if (enSuelo) {
      const a = Math.sin(f) * 0.85;
      partes.piernaI.rotation.x = a; partes.piernaD.rotation.x = -a;
      partes.brazoI.rotation.x = -a * 0.9; partes.brazoD.rotation.x = a * 0.9;
      jugador.children[0].position.y = 1.25 + Math.abs(Math.sin(f)) * 0.06;
    } else {
      partes.piernaI.rotation.x = -0.9; partes.piernaD.rotation.x = 0.4;
      partes.brazoI.rotation.x = -2.2; partes.brazoD.rotation.x = -2.2;
    }
  }

  function actualizar(dt) {
    tiempo += dt;
    nubes.forEach(n => { n.position.x += dt * 0.6; if (n.position.x > 90) n.position.x = -90; });

    if (estado === 'menu' || estado === 'cargando') {
      moverMundo(6 * dt);
      animarPersonaje(dt, false);
      return;
    }
    if (estado !== 'jugando' && estado !== 'fin') return;

    const vel = estado === 'fin' ? Math.max(0, velocidad -= 30 * dt) : velocidad;
    const avance = vel * dt;

    if (estado === 'jugando') {
      velocidad = Math.min(CONFIG.velocidadMaxima, velocidad + dt * 0.22);
      distancia += avance;
      puntos += avance;
      distDesdeFila += avance;
      if (!metaCreada && distancia >= CONFIG.metaMetros + Z_APARICION) crearMeta();
      if (!metaCreada && distDesdeFila >= proximaFila) {
        distDesdeFila = 0; proximaFila = 13 + Math.random() * 7;
        crearFila();
      }
    }

    moverMundo(avance);

    // Jugador: carril y salto
    jugador.position.x += (xObjetivo - jugador.position.x) * Math.min(1, dt * 14);
    jugador.rotation.z = (jugador.position.x - xObjetivo) * 0.12;
    if (!enSuelo) {
      vy -= 26 * dt; y += vy * dt;
      if (y <= 0) { y = 0; vy = 0; enSuelo = true; }
    }
    jugador.position.y = y;
    if (vel > 0.5) animarPersonaje(dt, true);

    if (invulnerable > 0) {
      invulnerable -= dt;
      jugador.visible = invulnerable <= 0 || Math.floor(invulnerable * 14) % 2 === 0;
    }

    // Objetos
    for (let i = objetos.length - 1; i >= 0; i--) {
      const o = objetos[i];
      o.malla.position.z += avance;
      const z = o.malla.position.z;
      if (o.tipo === 'apo') { o.gema.rotation.y += dt * 2.5; o.gema.rotation.x += dt; o.anillo.rotation.y += dt * 1.5; o.malla.position.y = Math.sin(tiempo * 3 + i) * 0.12; }

      if (o.activo && estado === 'jugando' && Math.abs(o.malla.position.x - jugador.position.x) < 1.05) {
        if (o.tipo === 'obs' && Math.abs(z) < 0.75 && y < 1.1 && invulnerable <= 0) {
          o.activo = false; o.golpeado = true;
          const it = CONFIG.obstaculos[o.idx];
          energia -= CONFIG.danoPorObstaculo;
          golpes[o.idx] = (golpes[o.idx] || 0) + 1;
          invulnerable = 1.3; temblor = 0.35;
          explosion(o.malla.position.x, 0.8, z, it.color);
          o.malla.rotation.x = -0.5; o.malla.position.y = -0.3;
          mostrarAviso('obs', '−' + CONFIG.danoPorObstaculo + ' · ' + it.emoji + ' ' + it.nombre, it.mensaje);
          if (energia <= 0) { energia = 0; actualizarHUD(); terminar(false); }
        } else if (o.tipo === 'apo' && Math.abs(z) < 0.95) {
          o.activo = false;
          const it = CONFIG.apoyos[o.idx];
          energia = Math.min(CONFIG.energiaInicial, energia + CONFIG.recuperaPorApoyo);
          apoyosRecogidos++; puntos += 50;
          recogidos[o.idx] = (recogidos[o.idx] || 0) + 1;
          explosion(o.malla.position.x, 1.1, z, it.color);
          escena.remove(o.malla); objetos.splice(i, 1);
          mostrarAviso('apo', '+' + CONFIG.recuperaPorApoyo + ' · ' + it.emoji + ' ' + it.nombre, it.mensaje);
          continue;
        }
      }
      if (o.tipo === 'obs' && o.activo && z > 1.2 && !o.contado) { o.contado = true; esquivados++; }
      if (z > 9) { escena.remove(o.malla); objetos.splice(i, 1); }
    }

    // Meta
    if (meta) {
      meta.position.z += avance;
      if (estado === 'jugando' && meta.position.z >= 0) terminar(true);
    }

    // Partículas
    for (let i = particulas.length - 1; i >= 0; i--) {
      const p = particulas[i];
      p.vida -= dt;
      p.v.y -= 14 * dt;
      p.m.position.addScaledVector(p.v, dt);
      p.m.position.z += avance;
      p.m.scale.setScalar(Math.max(0.01, p.vida / 0.6));
      if (p.vida <= 0) { escena.remove(p.m); particulas.splice(i, 1); }
    }

    actualizarHUD();
  }

  function actualizarCamara(dt) {
    const tx = jugador.position.x * 0.45;
    camara.position.x += (tx - camara.position.x) * Math.min(1, dt * 5);
    camara.position.y = camBase.y;
    camara.position.z = camBase.z;
    if (temblor > 0) {
      temblor -= dt;
      camara.position.x += (Math.random() - 0.5) * 0.3;
      camara.position.y += (Math.random() - 0.5) * 0.3;
    }
    camara.lookAt(jugador.position.x * 0.3, 1.2, -8);
  }

  function ajustarTamano() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camara.aspect = w / h;
    const vertical = w / h < 1;
    camara.fov = vertical ? 78 : 60;
    camBase.y = vertical ? 5 : 4.2;
    camBase.z = vertical ? 9 : 7.5;
    camara.updateProjectionMatrix();
  }
  window.addEventListener('resize', ajustarTamano);
  ajustarTamano();

  let ultimo = performance.now();
  function bucle(ahora) {
    const dt = Math.min(0.05, (ahora - ultimo) / 1000);
    ultimo = ahora;
    if (estado !== 'pausa') actualizar(dt);
    actualizarCamara(dt);
    renderer.render(escena, camara);
    requestAnimationFrame(bucle);
  }
  reiniciar();
  requestAnimationFrame(bucle);

  // Espera las fuentes para que las etiquetas 3D se dibujen bien
  const fuentesListas = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  Promise.race([fuentesListas, new Promise(r => setTimeout(r, 2500))]).then(() => {
    prepararRecursos();
    estado = 'menu';
    document.getElementById('cargando').remove();
    mostrarPantalla('inicio');
    document.getElementById('btnJugar').focus();
  });
})();
</script>
</body>
</html>
